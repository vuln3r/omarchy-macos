# omarchy-macos - Starship (Osaka Jade)
# Docs: https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

# Segments carry their own separators instead of the format string chaining
# them: outside a git repo the chained version leaves a stray coloured wedge
# where the branch segment would have been.
format = """
[](bg0)\
$os\
[](fg:bg0 bg:blue)\
$directory\
$git_branch$git_status\
$nodejs$python$rust$golang$php$swift$java\
$character"""

# Duration and clock go to the right prompt - on a single-line prompt $fill
# would push the character past them, to the far right of the window.
right_format = """$cmd_duration$time"""

palette = 'osakajade'

add_newline = true

# Source: basecamp/omarchy themes/osaka-jade/colors.toml
[palettes.osakajade]
bg0 = '#23372b'
bg1 = '#111c18'
bg2 = '#0c1512'
fg = '#c1c497'
blue = '#509475'
cyan = '#2dd5b7'
green = '#63b07a'
magenta = '#d2689c'
red = '#ff5345'
yellow = '#e5c736'
orange = '#a2734b'
comment = '#53685b'

[os]
disabled = false
style = "bg:bg0 fg:fg"
format = '[ $symbol ]($style)'

[os.symbols]
Macos = ""

# bg1 is the terminal background, so a segment painted in it has no visible
# edge at all. Jade and gold carry the powerline instead, dark text on top.
[directory]
style = "bg:blue fg:bg1"
format = "[ $path ]($style)[](fg:blue)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Projects" = " "
"Desktop" = " "

[git_branch]
symbol = ""
style = "bg:yellow fg:bg1"
format = '[](fg:yellow)[ $symbol $branch ]($style)'

[git_status]
style = "bg:yellow fg:bg1"
format = '[$all_status$ahead_behind ]($style)[](fg:yellow)'

[nodejs]
symbol = ""
style = "fg:green"
format = '[ $symbol $version ]($style)'

[python]
symbol = ""
style = "fg:yellow"
format = '[ $symbol $version ]($style)'

[rust]
symbol = ""
style = "fg:orange"
format = '[ $symbol $version ]($style)'

[golang]
symbol = ""
style = "fg:cyan"
format = '[ $symbol $version ]($style)'

[php]
symbol = ""
style = "fg:magenta"
format = '[ $symbol $version ]($style)'

[swift]
symbol = ""
style = "fg:orange"
format = '[ $symbol $version ]($style)'

[java]
symbol = ""
style = "fg:red"
format = '[ $symbol $version ]($style)'

[cmd_duration]
min_time = 2000
style = "fg:comment"
format = '[ $duration ]($style)'

[time]
disabled = false
time_format = "%H:%M"
style = "fg:comment"
format = '[ $time ]($style)'

[character]
# The leading space separates it from the last segment's arrow.
success_symbol = '[ ❯](bold green)'
error_symbol = '[ ❯](bold red)'
vimcmd_symbol = '[ ❮](bold blue)'
