# omarchy-macos - btop (Osaka Jade)
# Only the keys that differ from btop's defaults. save_config_on_exit is off
# so btop does not write its full config back into this repo on every quit.
color_theme = "osaka-jade"
theme_background = false
truecolor = true
vim_keys = true
rounded_corners = true
update_ms = 2000
proc_sorting = "cpu lazy"
proc_gradient = true
show_uptime = true
show_battery = true
save_config_on_exit = false
